<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>agent-b2b prototype</title>
<style>
  body {
    font-family: monospace;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  #state {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  button {
    font-family: monospace;
    font-size: 1.2rem;
    padding: 0.8rem 2rem;
    margin: 0.5rem;
    cursor: pointer;
    border: 1px solid #555;
    border-radius: 4px;
    background: #222;
    color: #eee;
  }
  button:hover { background: #333; }
  #powerBtn { font-size: 2rem; width: 3.5rem; height: 3.5rem; padding: 0; border-radius: 50%; background: #333; border: 2px solid #555; }
  #powerBtn.on { background: #2a5; border-color: #3b6; }
  #agentState { font-size: 1rem; color: #888; margin-top: 0.3rem; }
  #agentState.on { color: #6a6; }
  #toggleBtn { background: #25a; color: #fff; }
  #toggleBtn.thinking { background: #a52; }
  #info { margin-top: 2rem; color: #888; font-size: 0.9rem; }
  .sliders { margin-top: 1rem; }
  .sliders div { margin: 0.3rem 0; }
  .sliders input { width: 160px; vertical-align: middle; }
  .sliders label { color: #aaa; display: inline-block; width: 80px; text-align: right; margin-right: 0.5rem; }
  .state-config { margin-top: 1rem; }
  .state-config table { border-collapse: collapse; }
  .state-config th, .state-config td { padding: 0.2rem 0.8rem; text-align: center; }
  .state-config th { color: #aaa; }
  .state-config td:first-child { text-align: right; color: #aaa; }
</style>
</head>
<body>

<div>
  <button id="powerBtn" onclick="togglePower()">&#x23FB;</button>
</div>
<div id="agentState">off</div>
<div>
  <button id="toggleBtn" onclick="toggle()" disabled>idle</button>
</div>
<div class="sliders">
  <div><label>master</label><input type="range" min="0" max="100" value="50" oninput="setGain('master', this.value)"></div>
  <div><label>kick</label><input type="range" min="0" max="100" value="100" oninput="setGain('kick', this.value)"></div>
  <div><label>bass</label><input type="range" min="0" max="100" value="100" oninput="setGain('bass', this.value)"></div>
  <div><label>hihat</label><input type="range" min="0" max="100" value="100" oninput="setGain('hihat', this.value)"></div>
  <div><label>melody</label><input type="range" min="0" max="100" value="100" oninput="setGain('melody', this.value)"></div>
</div>
<div class="state-config">
  <table>
    <tr><th></th><th>idle</th><th>thinking</th></tr>
    <tr><td>kick</td><td><input type="checkbox" checked onchange="setTrackState('kick','idle',this.checked)"></td><td><input type="checkbox" checked onchange="setTrackState('kick','thinking',this.checked)"></td></tr>
    <tr><td>bass</td><td><input type="checkbox" checked onchange="setTrackState('bass','idle',this.checked)"></td><td><input type="checkbox" checked onchange="setTrackState('bass','thinking',this.checked)"></td></tr>
    <tr><td>hihat</td><td><input type="checkbox" checked onchange="setTrackState('hihat','idle',this.checked)"></td><td><input type="checkbox" checked onchange="setTrackState('hihat','thinking',this.checked)"></td></tr>
    <tr><td>melody</td><td><input type="checkbox" onchange="setTrackState('melody','idle',this.checked)"></td><td><input type="checkbox" checked onchange="setTrackState('melody','thinking',this.checked)"></td></tr>
  </table>
</div>
<div id="info">
  Start を押してから toggle で idle / thinking を切り替え
</div>

<script>
let masterGain = null;
let kickGain = null;
let bassGain = null;
let hihatGain = null;
let melodyGain = null;
let audioCtx = null;
let isPlaying = false;
let isThinking = false;
const trackEnabled = {
  kick:   { idle: true, thinking: true },
  bass:   { idle: true, thinking: true },
  hihat:  { idle: true, thinking: true },
  melody: { idle: false, thinking: true },
};

function setTrackState(track, state, enabled) {
  trackEnabled[track][state] = enabled;
  saveSettings();
}

function isTrackActive(track) {
  const state = isThinking ? 'thinking' : 'idle';
  return trackEnabled[track][state];
}
let nextBeatTime = 0;
let timerID = null;

const BPM = 128;
const BEAT = 60 / BPM; // 1拍の長さ (秒)
const SCHEDULE_AHEAD = 0.1; // 先読み秒数

function start() {
  if (isPlaying) return;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = gainValues.master / 100;
  masterGain.connect(audioCtx.destination);
  kickGain = audioCtx.createGain();
  kickGain.gain.value = gainValues.kick / 100;
  kickGain.connect(masterGain);
  bassGain = audioCtx.createGain();
  bassGain.gain.value = gainValues.bass / 100;
  bassGain.connect(masterGain);
  hihatGain = audioCtx.createGain();
  hihatGain.gain.value = gainValues.hihat / 100;
  hihatGain.connect(masterGain);
  melodyGain = audioCtx.createGain();
  melodyGain.gain.value = gainValues.melody / 100;
  melodyGain.connect(masterGain);
  isPlaying = true;
  nextBeatTime = audioCtx.currentTime + 0.05;
  scheduler();
  document.getElementById('toggleBtn').disabled = false;
  updatePowerUI();
  updateStateUI();
}

function stop() {
  if (!isPlaying) return;
  clearTimeout(timerID);
  if (audioCtx) audioCtx.close();
  audioCtx = null;
  masterGain = null;
  isPlaying = false;
  document.getElementById('toggleBtn').disabled = true;
  updatePowerUI();
  updateStateUI();
}

function togglePower() {
  if (isPlaying) stop();
  else start();
  saveSettings();
}

function updatePowerUI() {
  const btn = document.getElementById('powerBtn');
  btn.classList.toggle('on', isPlaying);
}

function updateStateUI() {
  const el = document.getElementById('agentState');
  el.textContent = isPlaying ? 'on' : 'off';
  el.className = isPlaying ? 'on' : '';
}

let beatCount = 0;

function scheduler() {
  while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
    playBeat(nextBeatTime, beatCount);
    beatCount++;
    nextBeatTime += BEAT / 2; // 8分音符単位でスケジュール
  }
  timerID = setTimeout(scheduler, 25);
}

function playBeat(time, count) {
  // kick: 4つ打ち (0, 4, 8, 12 ... = 毎拍)
  if (count % 4 === 0 && isTrackActive('kick')) {
    playKick(time);
  }

  // bass: 8分音符でルート音
  if (count % 2 === 0 && isTrackActive('bass')) {
    playBass(time);
  }

  // hihat: 8分音符の裏拍
  if (count % 2 === 1 && isTrackActive('hihat')) {
    playHihat(time);
  }

  // melody: 16分音符的に
  if (isTrackActive('melody')) {
    playMelody(time, count);
  }
}

function playKick(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, time);
  osc.frequency.exponentialRampToValueAtTime(30, time + 0.12);
  gain.gain.setValueAtTime(0.6, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
  osc.connect(gain).connect(kickGain);
  osc.start(time);
  osc.stop(time + 0.15);
}

function playBass(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(55, time); // A1
  gain.gain.setValueAtTime(0.4, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

  // simple low-pass
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(300, time);

  osc.connect(filter).connect(gain).connect(bassGain);
  osc.start(time);
  osc.stop(time + 0.12);
}

function playHihat(time) {
  const bufferSize = audioCtx.sampleRate * 0.05;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(8000, time);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

  noise.connect(filter).connect(gain).connect(hihatGain);
  noise.start(time);
  noise.stop(time + 0.05);
}

// minor pentatonic: A C D E G
const MELODY_NOTES = [220, 261.6, 293.7, 329.6, 392, 440, 523.3, 587.3];

function playMelody(time, count) {
  // 確率的に音を出す (全部鳴らすとうるさい)
  if (Math.random() > 0.4) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  const note = MELODY_NOTES[Math.floor(Math.random() * MELODY_NOTES.length)];
  osc.frequency.setValueAtTime(note, time);
  gain.gain.setValueAtTime(0.08, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1500, time);

  osc.connect(filter).connect(gain).connect(melodyGain);
  osc.start(time);
  osc.stop(time + 0.1);
}

const gainNodes = { master: () => masterGain, kick: () => kickGain, bass: () => bassGain, hihat: () => hihatGain, melody: () => melodyGain };
const gainValues = { master: 50, kick: 100, bass: 100, hihat: 100, melody: 100 };
function setGain(name, val) {
  gainValues[name] = Number(val);
  const node = gainNodes[name]();
  if (node) node.gain.value = val / 100;
  saveSettings();
}

function setState(newState) {
  isThinking = newState === 'thinking';
  updateStateUI();
  const btn = document.getElementById('toggleBtn');
  btn.textContent = isThinking ? 'thinking' : 'idle';
  btn.classList.toggle('thinking', isThinking);
}

function toggle() {
  setState(isThinking ? 'idle' : 'thinking');
}

// キーボードでも切り替え
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!isPlaying) start();
    else toggle();
  }
});

// WebSocket でサーバーから状態を受け取る
const WS_URL = 'ws://localhost:3000';
let ws = null;
let wsStatus = document.createElement('div');
wsStatus.style.cssText = 'position:fixed;top:8px;right:8px;font-size:0.8rem;color:#666';
document.body.appendChild(wsStatus);

function connectWs() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    wsStatus.textContent = 'ws: connected';
    wsStatus.style.color = '#4a4';
  };
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.state) {
      setState(data.state);
    }
  };
  ws.onclose = () => {
    wsStatus.textContent = 'ws: disconnected';
    wsStatus.style.color = '#a44';
    setTimeout(connectWs, 3000);
  };
  ws.onerror = () => ws.close();
}
connectWs();

// localStorage で設定を保存・復元
const STORAGE_KEY = 'agent-b2b-settings';

function saveSettings() {
  const data = { gainValues, trackEnabled, powerOn: isPlaying };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadSettings() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) { return; }

  if (data.gainValues) Object.assign(gainValues, data.gainValues);
  if (data.trackEnabled) {
    for (const track of Object.keys(trackEnabled)) {
      if (data.trackEnabled[track]) Object.assign(trackEnabled[track], data.trackEnabled[track]);
    }
  }

  // スライダーに反映
  document.querySelectorAll('.sliders input[type=range]').forEach(el => {
    const name = el.closest('div').querySelector('label').textContent;
    if (gainValues[name] !== undefined) el.value = gainValues[name];
  });

  // チェックボックスに反映
  document.querySelectorAll('.state-config tr').forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length < 3) return;
    const track = cells[0].textContent;
    if (!trackEnabled[track]) return;
    cells[1].querySelector('input').checked = trackEnabled[track].idle;
    cells[2].querySelector('input').checked = trackEnabled[track].thinking;
  });
}

loadSettings();
</script>
</body>
</html>
